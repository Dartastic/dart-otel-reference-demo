name: cache_service
description: >-
  Caching weather provider for the Dart OTel demo. Implements the v1
  weather API (the contract weather_client speaks), filling cache misses
  by calling Open-Meteo via weather_core's OpenMeteoProvider. Inserts a
  second server hop into the demo's distributed-tracing story.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  weather_core:
    path: ../../packages/weather_core
  weather_http_kit:
    path: ../../packages/weather_http_kit
  weather_otel:
    path: ../../packages/weather_otel

  # The SDK barrel re-exports the full API surface (including APICounter),
  # so no direct dartastic_opentelemetry_api dependency is needed.
  dartastic_opentelemetry: ^1.1.0-beta.12

  shelf: ^1.4.2
  shelf_router: ^1.1.4

  http: ^1.5.0
  logging: ^1.3.0
  meta: ^1.16.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.0
  test: ^1.26.0
