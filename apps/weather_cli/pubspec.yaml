name: weather_cli
description: >-
  Command-line client for the demo's public weather API. Calls
  GET /weather/<city> — the same route as the Flutter client — and
  prints a forecast. The swarmable binary that closes the trace
  tree from a user-initiated invocation through to Open-Meteo.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  weather_core:
    path: ../../packages/weather_core
  weather_http_kit:
    path: ../../packages/weather_http_kit
  weather_otel:
    path: ../../packages/weather_otel

  dartastic_opentelemetry: ^1.1.0-beta.15

  args: ^2.5.0
  http: ^1.5.0
  logging: ^1.3.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.0
  test: ^1.26.0
